spring:
  application:
    name: pos

server:
  port: 8080

app:
  jwt:
    issuer: pos-api
    secret: ${APP_JWT_SECRET:pos-development-secret-key-pos-development-secret-key}
    access-token-expiration: 15m
    refresh-token-expiration: 7d
  bootstrap-admin:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
